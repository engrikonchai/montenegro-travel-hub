<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:transparent; font-family:'Manrope',sans-serif; }
  #map { width:100%; height:100%; background:#eef3f6; }
  .mb-pin { width:20px; height:20px; border-radius:50%; background:oklch(58% 0.16 235); border:3px solid white; box-shadow:0 2px 10px rgba(20,50,90,.35); position:relative; }
  .mb-pin::after { content:''; position:absolute; inset:-8px; border-radius:50%; border:2px solid oklch(58% 0.16 235 / 0.5); animation:mbPulse 2.2s ease-out infinite; }
  @keyframes mbPulse { 0%{ transform:scale(0.6); opacity:.9; } 100%{ transform:scale(1.9); opacity:0; } }
  .mb-popup .leaflet-popup-content-wrapper { border-radius:16px; box-shadow:0 20px 40px -12px rgba(20,40,80,.3); padding:0; overflow:hidden; }
  .mb-popup .leaflet-popup-content { margin:0; width:240px !important; }
  .mb-popup .leaflet-popup-tip { display:none; }
  .mb-card-img { width:100%; height:110px; background:repeating-linear-gradient(135deg, oklch(93% 0.01 235), oklch(93% 0.01 235) 10px, oklch(96% 0.01 235) 10px, oklch(96% 0.01 235) 20px); display:flex; align-items:center; justify-content:center; color:oklch(52% 0.02 240); font-size:10px; letter-spacing:.04em; text-transform:uppercase; }
  .mb-card-body { padding:14px 16px 16px; }
  .mb-card-eyebrow { font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:oklch(58% 0.16 235); font-weight:600; }
  .mb-card-title { font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:17px; color:oklch(20% 0.03 250); margin:2px 0 6px; }
  .mb-card-desc { font-size:12.5px; line-height:1.5; color:oklch(45% 0.02 240); margin:0; }
  .leaflet-control-attribution { font-size:9px; }
</style>
</head>
<body>
<div id="map"></div>
<script>
  var regions = [
    { key:'kotor', lat:42.4247, lng:18.7712, name:'Kotor Bay', tag:'Fjord-like bay', desc:'Walled Old Town under Lovćen, cruise ships and a climb up the city walls.' },
    { key:'budva', lat:42.2911, lng:18.8400, name:'Budva', tag:'Coastal riviera', desc:'Beach clubs, a stone Old Town, and the base most travelers pick for the coast.' },
    { key:'perast', lat:42.4874, lng:18.7011, name:'Perast', tag:'Baroque village', desc:'A sleepy waterfront with a boat ride out to Our Lady of the Rocks.' },
    { key:'durmitor', lat:43.1531, lng:19.0623, name:'Durmitor', tag:'Mountain park', desc:'Glacial lakes, canyons, and Žabljak — Montenegro\'s hiking and ski base.' },
    { key:'skadar', lat:42.2564, lng:19.0959, name:'Skadar Lake', tag:'Wetland & wine', desc:'The Balkans\' largest lake — pelicans, water lilies, and lakeside vineyards.' },
    { key:'ulcinj', lat:41.9297, lng:19.2247, name:'Ulcinj', tag:'South coast', desc:'Long sand beaches, an Ottoman old town, and the country\'s windsurfing spot.' }
  ];
  var map = L.map('map', { zoomControl:true, scrollWheelZoom:false }).setView([42.65, 19.0], 8.4);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'&copy; OpenStreetMap contributors', maxZoom:17 }).addTo(map);

  var icon = L.divIcon({ className:'', html:'<div class="mb-pin"></div>', iconSize:[20,20], iconAnchor:[10,10] });
  var markers = {};
  regions.forEach(function(r){
    var html = '<div class="mb-popup-inner"><div class="mb-card-img">Photo of ' + r.name + '</div><div class="mb-card-body"><div class="mb-card-eyebrow">' + r.tag + '</div><div class="mb-card-title">' + r.name + '</div><p class="mb-card-desc">' + r.desc + '</p></div></div>';
    var m = L.marker([r.lat, r.lng], { icon:icon }).addTo(map).bindPopup(html, { className:'mb-popup', closeButton:true, minWidth:240 });
    markers[r.key] = m;
  });

  window.addEventListener('message', function(ev){
    var d = ev.data || {};
    if (d.type === 'flyTo' && markers[d.region]) {
      var m = markers[d.region];
      map.flyTo(m.getLatLng(), 11, { duration: 1.1 });
      setTimeout(function(){ m.openPopup(); }, 900);
    }
  });
</script>
</body>
</html>
